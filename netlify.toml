[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback. The app has no routes today, but a deep link should still boot the shell
# rather than 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints these filenames, so a changed file is always a changed URL and the
# content can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The two files that must never be served stale.
#
# A cached service worker is the classic PWA deploy bug: the browser keeps running the old
# worker, which keeps serving the old precached shell, and users sit on a build you already
# replaced with no way to pull the new one. index.html is the same hazard one step up — it
# is what points at the fingerprinted bundles, so a stale copy pins the whole app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Baseline hardening. No inline script beyond Vite's module bootstrap, and the only network
# egress is Bybit, so the connect-src can be tight.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
